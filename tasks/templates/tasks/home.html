<!DOCTYPE html>
<html>
    <head>
        <title>My To-do App</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
        <h1 class="text-center mb-4">My To-Do App</h1>

        <h3>My Tasks</h3>

        <form  method="POST" class="d-flex gap-2 mb-4">
            {% csrf_token %} 
            <input type="text"
            name="title"
            class="form-control"
            placeholder="Enter a task" required>
            <button class="btn btn-primary">Add Task</button>
        </form>
        
        {% for task in tasks %}
        <div class="card mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    {% if task.completed %}
                    <span class="text-decoration-line-through text-muted">{{ task.title }}</span>
                    {% else %}
                    {{ task.title }}
                    {% endif %}
                </div>
                <div>
                    {% if not task.completed %}
                    <a href="{% url 'complete_task' task.id %}" class="btn btn-success btn-sm">Complete</a>
                    {% else %}
                    <a href="{% url 'complete_task' task.id %}" class="btn btn-success btn-sm">Incomplete</a>

                    {% endif %}

                    <a href="{% url 'edit_task' task.id %}" class="btn btn-warning btn-sm">Edit</a>

                    <a href="{% url 'delete_task' task.id %}" class="btn btn-danger btn-sm">Delete</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p class="text-center text-muted">No tasks available.</p>
        {% endfor %}
    </div>
    </body>
</html>
