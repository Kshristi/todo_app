<!DOCTYPE html>
<html>
    <head>
        <title>Sign Up | DailyQuest</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body">
                            <h2 class="text-center mb-3">DailyQuest</h2>
                            <p class="text-center text-muted mb-4">Organize your day, one task at a time.</p>
                            <form method="POST">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <button type="submit" class="btn btn-primary btn-lg w-100">Sign Up</button>
                                <hr>
                                <p class="text-center">
                                    Already have an account?
                                    <a href="{% url 'login' %}">Login</a>
                                </p>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
