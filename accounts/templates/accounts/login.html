<!DOCTYPE html>
<html>
    <head>
        <title>Login | DailyQuest</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body">
                            <h2 class="text-center mb-3">Welcome Back</h2>
                            <p class="text-center text-muted mb-4">Sign in to continue your productivity journey.</p>
                            <form method="POST">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <button class="btn btn-success btn-lg w-100">Login </button>
                            </form>
                            <hr>
                            <p class="text-center">
                                Don't have an account?
                                <a href="{% url 'signup' %}"> Sign Up</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
